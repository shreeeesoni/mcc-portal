<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MCC Portal — Seat Allotment Preview</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #f4f4f4;
      --panel-dark: #1f1f1f;
      --panel-header-text: #ffffff;
      --blue: #1d8fe8;
      --light-border: #d9d9d9;
      --text: #111111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 0 24px;
    }

    .title {
      margin: 0 0 22px 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .cards {
      display: flex;
      gap: 24px;
      width: 100%;
      align-items: stretch;
    }

    .card {
      width: 50%;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
      border: 1px solid #d8d8d8;
    }

    .card-header {
      background: var(--panel-dark);
      color: var(--panel-header-text);
      font-weight: 700;
      font-size: 18px;
      padding: 18px 20px;
      min-height: 62px;
      display: flex;
      align-items: center;
    }

    .card-body {
      background: #f2f2f2;
      padding: 20px;
      min-height: 180px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .register-btn {
      background: var(--blue);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.1);
    }

    .allotment-box {
      width: 100%;
      min-height: 150px;
      border: 2px dashed #cfcfcf;
      background: rgba(255,255,255,0.12);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="title">MCC Portal — Seat Allotment Preview</h1>

    <div class="cards">
      <div class="card">
        <div class="card-header">New Registration</div>
        <div class="card-body">
          <button class="register-btn">Register Now</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Allotment Letter</div>
        <div class="card-body">
          <div class="allotment-box" aria-label="Allotment Letter area"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
